<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .chef-name {
            font-size: 0.9em;
            color: #9b59b6;
            font-weight: bold;
        }
        h1 {
            text-align: center;
            color: #d35400;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .dish-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .dish-card h3 {
            color: #2c3e50;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .dish-card .emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .back-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #c0392b;
        }
        .detail-view {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .detail-view.active {
            display: flex;
            gap: 30px;
        }
        .detail-content {
            flex: 1;
        }
        .chef-animation {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            animation: shake 0.5s ease-in-out infinite;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chef-emoji {
            font-size: 3em;
            animation: flip 0.8s ease-in-out infinite;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        @keyframes flip {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(30deg) scale(1.1); }
        }
        .detail-view h2 {
            color: #d35400;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section h4 {
            color: #e67e22;
            font-size: 1.3em;
            margin-bottom: 10px;
            border-left: 4px solid #e67e22;
            padding-left: 10px;
        }
        .detail-section p, .detail-section ul {
            color: #555;
            line-height: 1.8;
            padding-left: 20px;
        }
        .detail-section ul {
            list-style-type: disc;
        }
        .tip-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }
    </style>
</head>

        function showMenu() {
            document.getElementById('menuView').style.display = 'block';
            document.getElementById('detailView').classList.remove('active');
        }

        function showDetail(index) {
            const dish = dishes[index];
            document.getElementById('menuView').style.display = 'none';
            document.getElementById('detailView').classList.add('active');
            
            document.getElementById('dishName').textContent = dish.emoji + ' ' + dish.name;
            
            const ingredientsList = document.getElementById('ingredients');
            ingredientsList.innerHTML = '';
            dish.ingredients.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                ingredientsList.appendChild(li);
            });

            const stepsList = document.getElementById('steps');
            stepsList.innerHTML = '';
            dish.steps.forEach((step, i) => {
                const li = document.createElement('li');
                li.textContent = step;
                stepsList.appendChild(li);
            });

            document.getElementById('tips').textContent = dish.tips;
        }

        function init() {
            const grid = document.getElementById('dishesGrid');
            dishes.forEach((dish, index) => {
                const card = document.createElement('div');
                card.className = 'dish-card';
                card.innerHTML = `<div class="emoji">${dish.emoji}</div><h3>${dish.name}</h3>`;
                card.onclick = () => showDetail(index);
                grid.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>
